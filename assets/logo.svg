<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Dossier</title>
  <desc id="desc">Three client folders, the front one sealed, beside the word dossier.</desc>

  <!-- the card carries its own background so the logo reads the same on light and dark pages -->
  <rect x="1" y="1" width="598" height="178" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <g transform="translate(22 10)">
    <!-- back folders: other clients -->
    <rect x="56" y="14" width="40" height="14" rx="5" fill="#14b8a6"/>
    <rect x="56" y="22" width="96" height="74" rx="9" fill="#14b8a6"/>
    <rect x="40" y="28" width="40" height="14" rx="5" fill="#6366f1"/>
    <rect x="40" y="36" width="100" height="80" rx="9" fill="#6366f1"/>

    <!-- front folder -->
    <rect x="22" y="42" width="44" height="16" rx="6" fill="#d97706"/>
    <rect x="22" y="50" width="110" height="94" rx="10" fill="#f59e0b"/>
    <rect x="36" y="70" width="52" height="6" rx="3" fill="#fde68a"/>
    <rect x="36" y="84" width="40" height="6" rx="3" fill="#fde68a"/>
    <rect x="36" y="98" width="46" height="6" rx="3" fill="#fde68a"/>

    <!-- seal -->
    <circle cx="106" cy="118" r="22" fill="#dc2626"/>
    <circle cx="106" cy="118" r="16.5" fill="none" stroke="#fecaca" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="106" cy="113" r="5" fill="#fef2f2"/>
    <rect x="103.5" y="115" width="5" height="12" rx="2" fill="#fef2f2"/>

    <!-- wordmark -->
    <text x="168" y="94" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="-1">dossier</text>
    <text x="171" y="128" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18">one sealed Claude Code home per client</text>
  </g>
</svg>
